x-local-certificates: &local-certificates
  - type: bind
    source: ./certificates
    target: /run/secrets
    read_only: true
    bind:
      selinux: z

services:
  app:
    ports: !reset []
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/keycloak-ca.pem
    volumes: *local-certificates
  init:
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/keycloak-ca.pem
    volumes: *local-certificates
  tools:
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/keycloak-ca.pem
    volumes: *local-certificates
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "10.0.0.16:${APP_PORT:-3001}:443"
    volumes:
      - ./deploy/nginx/rede-local.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./.local/tls:/etc/nginx/tls:ro,Z
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]
