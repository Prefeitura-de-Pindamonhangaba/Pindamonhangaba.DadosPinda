# COMPOSE_PROFILES no .env: development (banco local) ou production (banco externo).
x-deployment: &deployment
  COMPOSE_PROFILES: ${COMPOSE_PROFILES:-development}
  KEYCLOAK_ALLOW_INSECURE_HTTP: ${KEYCLOAK_ALLOW_INSECURE_HTTP:-false}
  KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-false}
  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
  APP_URL: ${APP_URL:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
  DATABASE_URL: ${DATABASE_URL:-}
  POSTGRES_USER: ${POSTGRES_USER:-pinda}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
  POSTGRES_DB: ${POSTGRES_DB:-pinda_dados}
  INFOCONV_ENABLED: ${INFOCONV_ENABLED:-false}
  INFOCONV_TRANSPORT: ${INFOCONV_TRANSPORT:-soap}
  INFOCONV_CERTIFICATE_FORMAT: ${INFOCONV_CERTIFICATE_FORMAT:-auto}
  INFOCONV_CERTIFICATE_PATH: ${INFOCONV_CERTIFICATE_PATH:-/run/secrets/infoconv.pem}
  INFOCONV_CERTIFICATE_PASSPHRASE: ${INFOCONV_CERTIFICATE_PASSPHRASE:-}
  INFOCONV_REQUESTER_CPF: ${INFOCONV_REQUESTER_CPF:-}
  INFOCONV_CPF_WSDL: ${INFOCONV_CPF_WSDL:-https://acesso.infoconv.receita.fazenda.gov.br/ws/cpf/consultarcpf.asmx?wsdl}
  INFOCONV_CNPJ_WSDL: ${INFOCONV_CNPJ_WSDL:-https://acesso.infoconv.receita.fazenda.gov.br/ws/cnpj/consultarcnpj.asmx?wsdl}
  INFOCONV_CA_PATH: ${INFOCONV_CA_PATH:-/run/secrets/infoconv-ca.pem}
  INFOCONV_CACHE_KEY: ${INFOCONV_CACHE_KEY:-}
  INFOCONV_AUDIT_KEY: ${INFOCONV_AUDIT_KEY:-}
  INFOCONV_TIMEOUT_MS: ${INFOCONV_TIMEOUT_MS:-15000}
  INFOCONV_REQUESTS_PER_MINUTE: ${INFOCONV_REQUESTS_PER_MINUTE:-30}
  INFOCONV_MONTHLY_LIMIT: ${INFOCONV_MONTHLY_LIMIT:-10000}
  INFOCONV_MONTHLY_LIMIT_CPF: ${INFOCONV_MONTHLY_LIMIT_CPF:-}
  INFOCONV_MONTHLY_LIMIT_CNPJ: ${INFOCONV_MONTHLY_LIMIT_CNPJ:-}

x-certificates: &certificates
  - type: bind
    source: ${INFOCONV_CERTIFICATES_DIR:-./certificates}
    target: /run/secrets
    read_only: true

services:
  app:
    build:
      context: .
      args:
        NEXT_BUILD_CPUS: ${NEXT_BUILD_CPUS:-2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      <<: *deployment
    volumes: *certificates
    depends_on:
      init:
        condition: service_completed_successfully
    networks: [frontend, database]
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 3
  init:
    build:
      context: .
      target: bootstrap
    user: bun
    restart: "no"
    entrypoint: [bun, runtime/bootstrap.js]
    environment:
      <<: *deployment
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Administrador}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    volumes: *certificates
    networks: [frontend, database]
  tools:
    profiles: [tools]
    build:
      context: .
      target: tooling
    user: bun
    entrypoint: [bun, scripts/deploy-tool.ts]
    environment:
      <<: *deployment
    volumes: *certificates
    networks: [frontend, database]
  db:
    profiles: [development]
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pinda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-pinda_dados}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
networks:
  frontend:
  database:
    internal: true
volumes:
  postgres_data:
