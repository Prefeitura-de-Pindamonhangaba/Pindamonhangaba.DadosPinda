name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade e build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun test
      - run: bash tests/deploy-production.sh
      - run: bun run build
      - run: bun run typecheck

  browser:
    name: Navegador e PostgreSQL isolado
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pinda_test
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          POSTGRES_DB: pinda_actions_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pinda_test -d pinda_actions_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTH_TEST_DATABASE_URL: postgresql://pinda_test:ci-only-not-a-production-secret@127.0.0.1:5432/pinda_actions_test
      PLAYWRIGHT_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Fluxo OIDC com provedor fictício
        env:
          KEYCLOAK_TEST_DATABASE_URL: ${{ env.AUTH_TEST_DATABASE_URL }}
        run: bun test --timeout 30000 tests/keycloak-flow.test.ts
      - run: bun run test:e2e
